<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏴‍☠️ Treasure Hunt Coding</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #e2e8f0; min-height: 100vh; padding: 15px; }
.container { max-width: 550px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { color: #fbbf24; font-size: 1.5em; }
.header .sub { color: #94a3b8; font-size: 0.85em; margin-top: 4px; }
.card { background: #1e293b; padding: 22px; border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3); margin-bottom: 15px; }
.card h2 { color: #fbbf24; margin-bottom: 12px; font-size: 1.15em; }
.card p { color: #cbd5e1; line-height: 1.6; margin-bottom: 10px; }

/* INPUT & BUTTONS */
.login-input { width: 100%; padding: 16px; font-size: 1.3em;
  text-align: center; letter-spacing: 8px; text-transform: uppercase;
  background: #0f172a; color: #fbbf24; border: 3px solid #334155;
  border-radius: 12px; font-family: monospace; font-weight: bold; }
.login-input:focus { outline: none; border-color: #fbbf24; }

.answer-input { width: 100%; padding: 14px; font-size: 0.95em;
  background: #0f172a; color: #4ade80; border: 2px solid #334155;
  border-radius: 10px; font-family: 'Consolas', monospace; line-height: 1.5;
  resize: vertical; min-height: 180px; white-space: pre; }
.answer-input:focus { outline: none; border-color: #0ea5e9; }
.answer-input::placeholder { color: #64748b; }

.btn { width: 100%; padding: 15px; font-size: 1em;
  background: #fbbf24; color: #1e293b; border: none;
  border-radius: 12px; cursor: pointer; font-weight: bold;
  margin-top: 12px; transition: 0.2s; }
.btn:hover { background: #f59e0b; }
.btn-secondary { background: transparent; color: #94a3b8;
  border: 2px solid #334155; font-size: 0.85em; padding: 10px; }
.btn-secondary:hover { background: #334155; color: #e2e8f0; }

/* KOTAK INFORMASI */
.error { background: #7f1d1d; border-left: 4px solid #dc2626;
  padding: 12px 15px; border-radius: 8px; margin-top: 12px;
  color: #fecaca; font-size: 0.9em; }
.success { background: #14532d; border-left: 4px solid #16a34a;
  padding: 15px; border-radius: 8px; margin-top: 12px;
  color: #bbf7d0; text-align: center; font-weight: bold; }
.hint-box { background: #451a03; border-left: 4px solid #fbbf24;
  padding: 12px 15px; border-radius: 8px; margin-top: 12px;
  color: #fed7aa; font-size: 0.88em; }

.soal-box { background: #0c4a6e; padding: 18px; border-radius: 10px;
  border-left: 4px solid #0ea5e9; margin-bottom: 15px; }
.soal-box .label { color: #7dd3fc; font-size: 0.8em;
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.soal-box .pertanyaan { font-size: 0.95em; line-height: 1.6;
  color: #f1f5f9; white-space: pre-wrap; font-family: monospace; }

.clue-box { background: #78350f; padding: 18px; border-radius: 10px;
  border-left: 4px solid #f59e0b; margin-top: 12px; }
.clue-box .label { color: #fbbf24; font-size: 0.8em;
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.clue-box .clue-text { font-size: 1.05em; font-style: italic;
  color: #fed7aa; line-height: 1.5; }

.group-badge { background: #be185d; color: white; padding: 8px 20px;
  border-radius: 25px; font-weight: bold; display: inline-block;
  margin-bottom: 12px; font-size: 1em; }

/* DASHBOARD PROGRESS BAR BARU */
.progress-container { margin-bottom: 20px; }
.progress-text { display: flex; justify-content: space-between; font-size: 0.85em; color: #94a3b8; margin-bottom: 6px; font-weight: bold;}
.progress-bar { background: #0f172a; height: 24px; border-radius: 12px;
  overflow: hidden; border: 1px solid #334155; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
.progress-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b);
  height: 100%; transition: width 0.6s ease-in-out; display: flex;
  align-items: center; justify-content: center;
  font-size: 0.75em; font-weight: bold; color: #1e293b; }

/* DASHBOARD DAFTAR LOKASI BARU */
.loc-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
.loc-item { background: #0f172a; padding: 12px 15px; border-radius: 10px;
  display: flex; justify-content: space-between; align-items: center;
  border-left: 4px solid #475569; font-size: 0.95em; transition: 0.3s;}
.loc-item .loc-name { display: flex; align-items: center; gap: 10px; font-weight: 500;}
.loc-item .status-badge { font-size: 0.75em; padding: 4px 8px; border-radius: 6px; font-weight: bold;}

/* Status: Selesai */
.loc-item.done { border-left-color: #16a34a; background: #052e16; opacity: 0.8;}
.loc-item.done .status-badge { background: #16a34a; color: white; }

/* Status: Sedang Dikerjakan (Current) */
.loc-item.current { border-left-color: #fbbf24; background: #451a03;
  transform: scale(1.02); box-shadow: 0 4px 12px rgba(251,191,36,0.2); }
.loc-item.current .status-badge { background: #fbbf24; color: #1e293b; animation: pulse 2s infinite; }

/* Status: Terkunci */
.loc-item.locked { border-left-color: #334155; color: #64748b; }
.loc-item.locked .status-badge { background: #334155; color: #94a3b8; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

.answer-preview { background: #0f172a; padding: 12px; border-radius: 8px;
  font-family: 'Consolas', monospace; color: #4ade80; white-space: pre-wrap;
  font-size: 0.85em; margin-top: 8px; border: 1px solid #16a34a; }
</style>
</head>

    J:{text:"📌 INSTRUKSI:\nHitung nilai faktorial dari 6!.\nCetak dengan format 'Hasil = [angka]'.\n\n💻 OUTPUT YANG DIHARAPKAN:\nHasil = 720\n\n⚙️ KETENTUAN:\nWajib menggunakan perulangan DO-WHILE.", type:"do", req:["hasil","720"], hint:"int r=1, i=1; do{ r*=i; i++; }while(i<=6); printf(\"Hasil = %d\", r);"}
  }
};

// START & ROUTING HELPERS
const START_LOC = {};
['A','B','C','D','E','F','G','H','I','J'].forEach((g,i) => { START_LOC[g] = 'L' + (i + 1); });

function getStopNum(grp, loc) {
  const L = parseInt(loc.slice(1));
  const g = grp.charCodeAt(0) - 65;
  return ((L - 1 - g + 10) % 10) + 1;
}
function getLocForStop(grp, stopNum) {
  const g = grp.charCodeAt(0) - 65;
  const L = ((g + stopNum - 1) % 10) + 1;
  return 'L' + L;
}
function getNextLoc(loc) {
  const L = parseInt(loc.slice(1));
  return 'L' + (L % 10 + 1);
}

// ============ SESSION ============
function getSession() {
  try { const s = localStorage.getItem('hunt_session'); if (s) return JSON.parse(s); } catch (e) {}
  return window._memSession || null;
}
function setSession(grp) {
  const data = { group: grp, loginTime: Date.now() };
  window._memSession = data;
  try { localStorage.setItem('hunt_session', JSON.stringify(data)); } catch (e) {}
}
function clearSession() {
  window._memSession = null; window._memProgress = {};
  try { localStorage.removeItem('hunt_session'); localStorage.removeItem('hunt_progress'); } catch (e) {}
}
function logout() {
  if (confirm('Logout? Progress akan hilang.')) { clearSession(); renderLogin('', ''); }
}

// ============ PROGRESS ============
function getProgress(grp) {
  let fromStorage = {};
  try { const all = JSON.parse(localStorage.getItem('hunt_progress') || '{}'); fromStorage = all[grp] || {}; } catch (e) {}
  const fromMem = (window._memProgress || {})[grp] || {};
  return { ...fromStorage, ...fromMem };
}
function saveProgress(grp, loc, data) {
  if (!window._memProgress) window._memProgress = {};
  if (!window._memProgress[grp]) window._memProgress[grp] = {};
  window._memProgress[grp][loc] = { ...(window._memProgress[grp][loc] || {}), ...data, updatedAt: Date.now() };
  try {
    const all = JSON.parse(localStorage.getItem('hunt_progress') || '{}');
    if (!all[grp]) all[grp] = {};
    all[grp][loc] = { ...(all[grp][loc] || {}), ...data, updatedAt: Date.now() };
    localStorage.setItem('hunt_progress', JSON.stringify(all));
  } catch (e) {}
}
function isStopDone(grp, loc) { return getProgress(grp)[loc]?.done === true; }
function isStopUnlocked(grp, loc) {
  const stop = getStopNum(grp, loc);
  if (stop === 1) return true;
  const prevLoc = getLocForStop(grp, stop - 1);
  return isStopDone(grp, prevLoc);
}

// ============ VALIDASI KODE C ============
function validateCode(input, q) {
  const clean = input.toLowerCase().replace(/\s+/g, '');
  if (!clean) return { ok: false, msg: "Kode tidak boleh kosong!" };
  if (!clean.includes('printf')) return { ok: false, msg: "Kode kamu belum ada fungsi printf() untuk mencetak output." };

  let hasLoop = false;
  if (q.type === 'for' && clean.includes('for')) hasLoop = true;
  if (q.type === 'while' && clean.includes('while')) hasLoop = true;
  if (q.type === 'do' && clean.includes('do') && clean.includes('while')) hasLoop = true;
  if (!hasLoop) return { ok: false, msg: `Kode kamu wajib menggunakan perulangan ${q.type.toUpperCase()}!` };

  for (let kw of q.req) { if (!clean.includes(kw)) return { ok: false, msg: `Kode kamu harus mengandung angka/kata '${kw}'.` }; }
  return { ok: true };
}

// ============ ROUTER ============
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const urlLoc = (params.get('loc') || '').toUpperCase();
const urlGrp = (params.get('grp') || '').toUpperCase();
const session = getSession();

if (!session) { renderLogin(urlLoc, urlGrp); } else { renderAfterLogin(session.group); }

function renderLogin(pendingLoc, pendingGrp) {
  let pending = '';
  if (pendingLoc && pendingGrp) {
    pending = `<div style="background:#0c4a6e;padding:10px;border-radius:8px;margin-bottom:12px;border-left:3px solid #0ea5e9;color:#7dd3fc;font-size:0.85em;">📍 QR untuk Kelompok <strong>${pendingGrp}</strong> terdeteksi. Login dulu.</div>`;
  }
  app.innerHTML = `
    <div class="header"><h1>🏴‍☠️ TREASURE HUNT</h1><div class="sub">Belajar Perulangan Bahasa C</div></div>
    <div class="card">
      <h2>🔑 Login Kelompok</h2>${pending}
      <p style="font-size:0.9em;color:#94a3b8;">Masukkan kode verifikasi dari kartu kelompokmu.</p>
      <input type="text" class="login-input" id="pwdInput" placeholder="A7X9" maxlength="8" autocomplete="off">
      <button class="btn" onclick="handleLogin()">🔓 Masuk</button>
      <div id="loginError"></div>
    </div>`;
  const inp = document.getElementById('pwdInput'); inp.focus();
  inp.addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); });
}

function handleLogin() {
  const rawVal = document.getElementById('pwdInput').value || '';
  const input = rawVal.replace(/\s+/g, '').toUpperCase();
  const errEl = document.getElementById('loginError');
  if (!input) { errEl.innerHTML = '<div class="error">❌ Masukkan kode dulu!</div>'; return; }

  let grp = null;
  for (const k in KODE) { if (KODE[k] === input) { grp = k; break; } }
  if (!grp) {
    errEl.innerHTML = `<div class="error">❌ Kode "<strong>${input}</strong>" tidak dikenali!<br><small style="opacity:0.85;">Kode valid: A7X9, B2K4, C5M8, D3P6, E8N1, F4R7, G6T2, H9W5, I1Y3, J7Z8</small><br>Periksa kembali kartu kelompokmu.</div>`;
    document.getElementById('pwdInput').value = ''; document.getElementById('pwdInput').focus(); return;
  }
  if (urlGrp && urlGrp !== grp) {
    errEl.innerHTML = `<div class="error">❌ QR ini untuk Kelompok <strong>${urlGrp}</strong>, tapi kamu memasukkan kode untuk Kelompok <strong>${grp}</strong>.<br><br>Cari QR dengan kode <strong>${KODE[grp]}</strong> di sekitarmu.</div>`;
    return;
  }
  setSession(grp); renderAfterLogin(grp);
}

function renderAfterLogin(grp) {
  if (urlLoc && urlGrp) {
    if (urlGrp !== grp) { renderWrongQR(grp, urlGrp, urlLoc); }
    else if (!isStopUnlocked(grp, urlLoc)) { renderLocked(grp, urlLoc); }
    else { renderQuestion(grp, urlLoc); }
  } else { renderDashboard(grp); }
}

function renderWrongQR(myGrp, qrGrp, loc) {
  app.innerHTML = `
    <div class="header"><h1>⚠️ SALAH QR!</h1></div>
    <div class="card" style="border: 3px solid #dc2626;">
      <div style="text-align:center;margin-bottom:15px;"><div class="group-badge">KAMU: KELOMPOK ${myGrp} (${KODE[myGrp]})</div></div>
      <div class="error" style="font-size:0.95em;padding:18px;"><strong>❌ QR ini BUKAN untukmu!</strong><br><br>QR milik: <strong>Kelompok ${qrGrp} (${KODE[qrGrp]})</strong><br>Kamu Kelompok <strong>${myGrp}</strong>.<br><br>Cari QR dengan kode <strong style="color:#fbbf24;font-size:1.15em;">${KODE[myGrp]}</strong> di lokasi ini.</div>
      <button class="btn btn-secondary" onclick="location.href='?'">🏠 Dashboard</button>
    </div>`;
}

function renderLocked(grp, loc) {
  const stop = getStopNum(grp, loc);
  const prevLoc = getLocForStop(grp, stop - 1);
  const prevIdx = parseInt(prevLoc.slice(1)) - 1;
  app.innerHTML = `
    <div class="header"><h1>🔒 BELUM BISA DIBUKA</h1></div>
    <div class="card" style="border: 3px solid #f59e0b;">
      <div class="error" style="background:#451a03;border-left-color:#fbbf24;color:#fed7aa;"><strong>⚠️ Kamu belum menyelesaikan stop sebelumnya!</strong><br><br>Ini adalah <strong>Stop ${stop}</strong>.<br>Selesaikan dulu <strong>Stop ${stop - 1}</strong> di <strong>${LOKASI[prevIdx]}</strong>.</div>
      <button class="btn btn-secondary" onclick="location.href='?'">🏠 Dashboard</button>
    </div>`;
}

function renderQuestion(grp, loc) {
  const L = parseInt(loc.slice(1));
  const stop = getStopNum(grp, loc);
  const q = QUESTIONS['L' + L][grp];
  const progress = getProgress(grp)[loc] || {};
  if (progress.done) return renderDoneView(grp, loc, progress);

  const attempts = progress.attempts || 0;
  const showHint = attempts >= 2;
  const showFullAnswer = attempts >= 5;

  let content = `
    <div class="header">
      <h1>📍 ${LOKASI[L-1].toUpperCase()}</h1>
      <div class="sub">Stop ${stop} dari 10 ${attempts > 0 ? `<span class="attempt-badge">Percobaan: ${attempts}</span>` : ''}</div>
    </div>
    <div class="card">
      <div style="text-align:center;margin-bottom:12px;"><div class="group-badge">KELOMPOK ${grp} · ${KODE[grp]}</div></div>
      <div class="soal-box">
        <div class="label">📝 TUGAS PROGRAM</div>
        <div class="pertanyaan">${q.text}</div>
      </div>
      <div style="margin-top:10px;">
        <label style="color:#94a3b8;font-size:0.85em;margin-bottom:6px;display:block;">✍️ Tulis Kode C kamu:</label>
        <textarea class="answer-input" id="answerInput" placeholder="#include <stdio.h>&#10;int main() {&#10;  // tulis kodemu di sini&#10;  return 0;&#10;}"></textarea>
      </div>`;

  if (showHint && !showFullAnswer) { content += `<div class="hint-box">💡 <strong>Hint:</strong> <code>${q.hint}</code></div>`; }
  if (showFullAnswer) {
    content += `<div class="hint-box" style="background:#7f1d1d;border-color:#dc2626;color:#fecaca;"><strong>🔓 Contoh Jawaban (percobaan ke-${attempts}):</strong><br><code style="color:#fbbf24;">${q.hint}</code><br><small>Ketik ulang kode di atas untuk melanjutkan.</small></div>`;
  }

  content += `
      <button class="btn" onclick="submitAnswer('${grp}', '${loc}')">✅ Kirim Kode</button>
      <div id="feedback"></div>
      <button class="btn btn-secondary" onclick="location.href='?'">🏠 Dashboard</button>
    </div>`;

  app.innerHTML = content;
  document.getElementById('answerInput').focus();
}

function submitAnswer(grp, loc) {
  const L = parseInt(loc.slice(1));
  const q = QUESTIONS['L' + L][grp];
  const input = document.getElementById('answerInput').value;
  const feedback = document.getElementById('feedback');
  const progress = getProgress(grp)[loc] || {};
  const attempts = (progress.attempts || 0) + 1;
  const check = validateCode(input, q);

  if (check.ok) {
    saveProgress(grp, loc, { done: true, answer: input.trim(), attempts: attempts, submittedAt: Date.now() });
    renderSuccess(grp, loc);
  } else {
    saveProgress(grp, loc, { attempts: attempts, lastWrong: input.trim() });
    feedback.innerHTML = `<div class="error">❌ <strong>Kode Belum Tepat!</strong> (Percobaan ke-${attempts})<br>${check.msg}</div>`;
    if (attempts >= 5) setTimeout(() => renderQuestion(grp, loc), 2000);
  }
}

function renderSuccess(grp, loc) {
  const L = parseInt(loc.slice(1));
  const stop = getStopNum(grp, loc);
  const nextL = getNextLoc(loc);
  const isLast = stop === 10;

  let content = `
    <div class="header"><h1>🎉 BENAR!</h1></div>
    <div class="card">
      <div class="success" style="font-size:1.1em;padding:20px;">✅ Kode kamu valid dan berhasil!<br><small style="font-weight:normal;opacity:0.9;">Stop ${stop}/10 — ${LOKASI[L-1]}</small></div>`;

  if (isLast) {
    content += `<div style="background:#4c1d95;padding:25px;border-radius:12px;border:3px solid #8b5cf6;text-align:center;margin-top:15px;"><div style="font-size:1.5em;font-weight:bold;color:#e9d5ff;">🏆 SEMUA SELESAI! 🏆</div><div style="color:#c4b5fd;margin-top:10px;">Kembali ke titik start & serahkan lembar jawaban!</div></div>`;
  } else {
    content += `<div class="clue-box" style="margin-top:15px;"><div class="label">🗝️ CLUE BERIKUTNYA</div><div class="clue-text">${CLUE[parseInt(nextL.slice(1)) - 1]}</div></div>`;
  }
  content += `<button class="btn" onclick="location.href='?'" style="margin-top:15px;">🏠 Kembali ke Dashboard</button></div>`;
  app.innerHTML = content;
}

function renderDoneView(grp, loc, progress) {
  const L = parseInt(loc.slice(1));
  const stop = getStopNum(grp, loc);
  const nextL = getNextLoc(loc);
  const isLast = stop === 10;

  let content = `
    <div class="header"><h1>✅ SUDAH SELESAI</h1></div>
    <div class="card">
      <div class="success" style="margin-bottom:15px;">Sudah dikerjakan di Stop ${stop}/10 — ${LOKASI[L-1]}</div>
      <div style="margin-top:10px;"><div style="color:#94a3b8;font-size:0.85em;margin-bottom:5px;">Kode yang kamu kirim:</div><div class="answer-preview">${progress.answer}</div></div>`;

  if (!isLast) {
    content += `<div class="clue-box" style="margin-top:15px;"><div class="label">🗝️ CLUE BERIKUTNYA</div><div class="clue-text">${CLUE[parseInt(nextL.slice(1)) - 1]}</div></div>`;
  } else {
    content += `<div style="background:#4c1d95;padding:20px;border-radius:12px;border:3px solid #8b5cf6;text-align:center;margin-top:15px;"><div style="font-size:1.3em;font-weight:bold;color:#e9d5ff;">🏆 KAMU SUDAH SELESAI! 🏆</div></div>`;
  }
  content += `<button class="btn btn-secondary" onclick="location.href='?'" style="margin-top:15px;">🏠 Dashboard</button></div>`;
  app.innerHTML = content;
}

// ==================== DASHBOARD BARU ====================
function renderDashboard(grp) {
  const progress = getProgress(grp);
  const doneCount = Object.values(progress).filter(p => p.done).length;
  const percent = Math.round(doneCount / 10 * 100);
  const startLoc = START_LOC[grp];
  const startIdx = parseInt(startLoc.slice(1)) - 1;

  let locList = '';
  for (let i = 0; i < 10; i++) {
    const L = ((grp.charCodeAt(0) - 65 + i) % 10) + 1;
    const locCode = 'L' + L;
    const isDone = progress[locCode]?.done;
    const prevDone = i === 0 || progress[getLocForStop(grp, i)]?.done;
    const isCurrent = !isDone && prevDone;
    
    let statusClass, statusText, icon;
    if (isDone) {
      statusClass = 'done'; statusText = 'Selesai'; icon = '✅';
    } else if (isCurrent) {
      statusClass = 'current'; statusText = 'Kerjakan'; icon = '🎯';
    } else {
      statusClass = 'locked'; statusText = 'Terkunci'; icon = '🔒';
    }

    locList += `
      <div class="loc-item ${statusClass}">
        <div class="loc-name">
          <span style="font-size:1.2em;">${icon}</span> Stop ${i+1} — ${LOKASI[L-1]}
        </div>
        <div class="status-badge">${statusText}</div>
      </div>`;
  }

  let nextAction = '';
  if (doneCount === 0) {
    nextAction = `<div style="background:#451a03;padding:15px;border-radius:10px;border-left:4px solid #fbbf24;margin-bottom:20px;">
      <div style="color:#fbbf24;font-weight:bold;margin-bottom:8px;font-size:1.1em;">🎯 MULAI DARI SINI</div>
      <div style="color:#fed7aa;font-size:0.95em;line-height:1.5;">
        Pergi ke <strong>${LOKASI[startIdx]}</strong><br>
        Cari QR Kelompok ${grp} (kode ${KODE[grp]}) lalu scan!</div>
    </div>`;
  } else if (doneCount < 10) {
    const nextStop = doneCount + 1;
    const nextLoc = getLocForStop(grp, nextStop);
    const nextLocIdx = parseInt(nextLoc.slice(1)) - 1;
    nextAction = `<div style="background:#451a03;padding:15px;border-radius:10px;border-left:4px solid #fbbf24;margin-bottom:20px;">
      <div style="color:#fbbf24;font-weight:bold;margin-bottom:8px;font-size:1.1em;">➡️ LANJUTKAN — STOP ${nextStop}/10</div>
      <div style="color:#fed7aa;line-height:1.5;">
        Cari QR Kelompok ${grp} di:<br>
        <strong>${CLUE[nextLocIdx]}</strong></div>
    </div>`;
  } else {
    nextAction = `<div style="background:#4c1d95;padding:20px;border-radius:12px;border:3px solid #8b5cf6;text-align:center;margin-bottom:20px;">
      <div style="font-size:1.4em;font-weight:bold;color:#e9d5ff;">🎉 SEMUA SELESAI! 🎉</div>
      <div style="color:#c4b5fd;margin-top:6px;">Serahkan lembar jawaban ke guru!</div>
    </div>`;
  }

  app.innerHTML = `
    <div class="header">
      <h1>🏴‍☠️ TREASURE HUNT</h1>
      <div class="sub">Kelompok ${grp} · ${KODE[grp]}</div>
    </div>
    <div class="card">
      <h2>📊 Progress Kamu</h2>
      
      <div class="progress-container">
        <div class="progress-text">
          <span>Status Perjalanan</span>
          <span>${doneCount} / 10 Selesai (${percent}%)</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${percent}%"></div>
        </div>
      </div>

      ${nextAction}
      <div class="loc-list">
        ${locList}
      </div>
      
      <button class="btn btn-secondary" onclick="logout()" style="margin-top:20px;">🚪 Logout</button>
    </div>`;
}
</script>
</body>
</html>
